<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>근무일지 입력 - 셔틀 관리 시스템</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/teacher.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="back-button" onclick="window.location.href='teacher-select.html'">
                <span class="material-symbols-outlined">arrow_back</span>
                뒤로가기
            </div>
            <h1 id="teacherName">선생님 이름</h1>
            <div class="month-selector">
                <button onclick="changeMonth(-1)" class="month-btn">
                    <span class="material-symbols-outlined">chevron_left</span>
                </button>
                <span id="currentMonth" class="current-month">2024년 1월</span>
                <button onclick="changeMonth(1)" class="month-btn">
                    <span class="material-symbols-outlined">chevron_right</span>
                </button>
            </div>
            <div class="work-stats">
                <div class="stat-item">
                    <span class="stat-label">실제 근무 일수:</span>
                    <span class="stat-value" id="actualWorkDays">0일</span>
                    <span class="stat-total">/<span id="totalWorkDays">0일</span></span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">완료율:</span>
                    <span class="stat-percentage" id="completionRate">0%</span>
                </div>
            </div>
        </header>
        <main class="main-content">
            <div class="work-logs-container">
                <table class="work-logs-table" id="workLogsTable">
                    <thead>
                        <tr>
                            <th>날짜</th>
                            <th>요일</th>
                            <th>출근 시간</th>
                            <th>첫 차량 출발</th>
                            <th>마지막 하차</th>
                            <th>원 도착 시간</th>
                            <th>메모</th>
                            <th>구분</th>
                            <th>상태</th>
                        </tr>
                    </thead>
                    <tbody id="workLogsBody"></tbody>
                </table>
            </div>
        </main>
    </div>
    <div id="autosaveNotification" class="autosave-notification">
        <span class="material-symbols-outlined">check_circle</span>
        <span>자동 저장되었습니다</span>
    </div>
    <script src="js/app.js"></script>
    <script src="js/teacher.js"></script>
</body>
</html>
