<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 로그인 - 셔틀 관리 시스템</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="back-button" onclick="window.location.href='index.html'">
                <span class="material-symbols-outlined">arrow_back</span>
                뒤로가기
            </div>
            <h1>관리자 로그인</h1>
            <p>관리자 비밀번호를 입력하세요</p>
        </header>
        <main class="main-content">
            <section class="login-section">
                <div class="login-form">
                    <div class="form-group">
                        <label for="adminPassword">비밀번호</label>
                        <input type="password" id="adminPassword" placeholder="비밀번호를 입력하세요">
                    </div>
                    <button onclick="loginAdmin()" class="login-btn">
                        <span class="material-symbols-outlined">login</span>
                        로그인
                    </button>
                </div>
            </section>
        </main>
    </div>
    <script>
        function goBack() { window.location.href = 'index.html'; }

        function loginAdmin() {
            const password = document.getElementById('adminPassword').value;
            const saved = localStorage.getItem('admin_password');
            const correct = saved ? JSON.parse(saved) : 'admin123';
            if (password === correct) {
                sessionStorage.setItem('adminLoggedIn', 'true');
                window.location.href = 'admin.html';
            } else {
                alert('비밀번호가 틀렸습니다.');
            }
        }

        document.addEventListener('DOMContentLoaded', function () {
            document.getElementById('adminPassword').addEventListener('keypress', function (e) {
                if (e.key === 'Enter') loginAdmin();
            });
        });
    </script>
</body>
</html>
